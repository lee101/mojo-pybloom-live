[project]
name = "mojo-pybloom-live"
version = "0.1.0"
description = "Bloom and scalable Bloom filters backed by Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "bloom-filter", "probabilistic-data-structure"]
dependencies = ["bitarray", "numpy", "xxhash"]

[project.optional-dependencies]
dev = ["pytest", "pybloom-live==4.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
